services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rcm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rcm_password}
      POSTGRES_DB: ${POSTGRES_DB:-rcm}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rcm} -d ${POSTGRES_DB:-rcm}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    command: pnpm --filter api exec prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rcm}:${POSTGRES_PASSWORD:-rcm_password}@postgres:5432/${POSTGRES_DB:-rcm}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rcm}:${POSTGRES_PASSWORD:-rcm_password}@postgres:5432/${POSTGRES_DB:-rcm}?schema=public
      REDIS_URL: redis://redis:6379
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      API_PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
